version: 1

profiles:
  clawhub:
    scanners:
      - id: skillspector
        gate:
          rules:
            - id: execution-failed
              path:
                - execution_successful
                - executionSuccessful
              equals: false
              action: block
            - id: do-not-install
              path:
                - risk_recommendation|riskRecommendation|recommendation
                - risk_assessment.recommendation|risk_recommendation|riskRecommendation
                - riskAssessment.recommendation|risk_recommendation|riskRecommendation
              equals: DO_NOT_INSTALL
              normalize: identifier
              action: block
            - id: critical-finding
              path:
                - filtered_findings[].severity|risk_severity|level
                - filteredFindings[].severity|risk_severity|level
                - findings[].severity|risk_severity|level
                - issues[].severity|risk_severity|level
                - vulnerabilities[].severity|risk_severity|level
              equals: CRITICAL
              normalize: identifier
              fallback: root
              action: block
            - id: high-finding
              path:
                - filtered_findings[].severity|risk_severity|level
                - filteredFindings[].severity|risk_severity|level
                - findings[].severity|risk_severity|level
                - issues[].severity|risk_severity|level
                - vulnerabilities[].severity|risk_severity|level
              equals: HIGH
              normalize: identifier
              fallback: root
              action: warn
      - id: clawscan-static
        gate:
          rules: &static-gate-rules
            - id: any-finding
              path: findings[]
              exists: true
              action: warn
  clawhub-static:
    scanners:
      - id: clawscan-static
        gate:
          rules: *static-gate-rules
