name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "pe/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  test:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check_name: Test
          - os: xcode-27
            check_name: Test (macOS 27)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up npm
        run: npm install -g npm@^12.0.2

      - name: Check formatting
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/clawscan

      - name: Test Docker mount paths and permissions
        if: runner.os == 'Linux'
        run: |
          docker pull alpine:3.23
          node --test scripts/docker-mounts.test.mjs

      - name: Check npm package
        run: |
          node --test npm/clawscan/test/*.test.mjs
          node --test scripts/build-npm-package.test.mjs
          node --test scripts/release-notes.test.mjs
          node scripts/build-npm-package.mjs --version v0.0.0 --pack --smoke

      - name: Verify macOS minimum and both architectures
        if: runner.os == 'macOS'
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
          for npm_arch in arm64 x64; do
            binary="dist/npm/package/binaries/darwin-${npm_arch}/clawscan"
            minos=$(xcrun vtool -show-build "$binary" | awk '$1 == "minos" { print $2 }')
            test "$minos" = 13.0
          done
          dist/npm/package/binaries/darwin-arm64/clawscan --version
          dist/npm/package/binaries/darwin-arm64/clawscan --help
          arch -x86_64 dist/npm/package/binaries/darwin-x64/clawscan --version
          arch -x86_64 dist/npm/package/binaries/darwin-x64/clawscan --help

      - name: Test runtime update branch push
        run: node --test scripts/push-runtime-tool-update-branch.test.mjs

      - name: Test Security Signals publishing
        run: node --test scripts/publish-security-signals-results.test.mjs
