name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "pe/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check formatting
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/clawscan

      - name: Check npm package
        run: |
          node --test npm/clawscan/test/*.test.mjs
          node --test scripts/build-npm-package.test.mjs
          node scripts/build-npm-package.mjs --version v0.0.0 --pack --smoke

      - name: Test runtime update branch push
        run: node --test scripts/push-runtime-tool-update-branch.test.mjs

      - name: Test Security Signals publishing
        run: node --test scripts/publish-security-signals-results.test.mjs
