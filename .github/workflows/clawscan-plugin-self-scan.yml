name: ClawScan Plugin Self-Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan the OpenClaw plugin
        env:
          CLAWSCAN_SKILLSPECTOR_LLM: "0"
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/clawscan-plugin-artifact.json"
          go run ./cmd/clawscan ./npm/clawscan-plugin \
            --config ./npm/clawscan-plugin/profiles/clawhub.yml \
            --profile clawhub \
            --sandbox docker \
            --json \
            --output "$artifact"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const artifact = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const required = ["skillspector", "clawscan-static"];
            if (artifact.schemaVersion !== "clawscan-run-v1" || artifact.gate !== "pass") {
              throw new Error(`ClawScan plugin self-scan gate was ${artifact.gate ?? "invalid"}`);
            }
            for (const scanner of required) {
              if (artifact.scanners?.[scanner]?.status !== "completed") {
                throw new Error(`Required self-scan scanner ${scanner} did not complete`);
              }
            }
          ' "$artifact"
