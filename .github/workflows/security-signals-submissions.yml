name: Security Signals submissions

on:
  pull_request:
    paths:
      - '.github/workflows/security-signals-submissions.yml'
      - 'cmd/clawscan/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'leaderboard/submissions/**'
      - 'scripts/validate-security-signals-submissions.sh'

permissions:
  contents: read

jobs:
  validate:
    name: Validate submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate changed submissions
        run: scripts/validate-security-signals-submissions.sh

      - name: Upload score previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-signals-submission-scores
          path: dist/security-signals-submission-scores
          if-no-files-found: ignore
