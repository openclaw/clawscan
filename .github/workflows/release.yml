name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing
        type: boolean
        default: true
      version:
        description: Dated changelog version to verify (blank uses the latest dated section)
        type: string
        required: false

permissions: {}
env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release guard
        run: python3 -B scripts/test_release_preflight.py
      - name: Validate source, changelog, signature, and exact-commit push CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          CI_WORKFLOWS: ci.yml
          PACKAGE_NAME: '@openclaw/clawscan'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$VERSION" = main ]; then export VERSION=; fi
          python3 scripts/release-preflight.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          go-version-file: go.mod
      - name: Test and build release matrix
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --test npm/clawscan/test/*.test.mjs
          node --test scripts/build-npm-package.test.mjs
          make release VERSION="$TAG"
      - name: Sign and notarize macOS payloads
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/sign-release-macos.sh
      - name: Pack the same signed release binaries into npm
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/build-npm-package.mjs --version "$TAG" --binary-root dist --pack --smoke
      - name: Freeze verified channel payloads
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir release-assets
          cp dist/*.tar.gz dist/*.zip release-assets/
          cp "dist/npm/openclaw-clawscan-${VERSION}.tgz" "release-assets/clawscan-${VERSION}.tgz"
          cd release-assets
          shasum -a 1 ./*.tgz > "clawscan-${VERSION}.tgz.sha1"
          shasum -a 256 ./*.tgz > "clawscan-${VERSION}.tgz.sha256"
          shasum -a 256 ./*.tgz ./*.tar.gz ./*.zip > checksums.txt
          cp checksums.txt SHA256SUMS
          shasum -a 256 -c checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      matrix:
        include:
          - runner: xcode-27
            arch: arm64
            npm_arch: arm64
          - runner: xcode-27
            arch: amd64
            npm_arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: payload
      - name: Verify signatures and identical npm payload
        env:
          TAG: ${{ needs.build.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          NPM_ARCH: ${{ matrix.npm_arch }}
        run: |
          set -euo pipefail
          cd payload/release-assets
          shasum -a 256 -c checksums.txt
          mkdir native npm
          tar -xzf "clawscan_${TAG}_darwin_${ARCH}.tar.gz" -C native
          tar -xzf "clawscan-${TAG#v}.tgz" -C npm
          binary="native/clawscan_${TAG}_darwin_${ARCH}/clawscan"
          cmp "$binary" "npm/package/binaries/darwin-${NPM_ARCH}/clawscan"
          codesign --verify --strict --check-notarization -R=notarized "$binary"
          codesign -dv --verbose=4 "$binary" 2>&1 | grep -Fx 'TeamIdentifier=FWJYW4S8P8'
          minos=$(xcrun vtool -show-build "$binary" | awk '$1 == "minos" { print $2 }')
          test "$minos" = 13.0
          if [ "$ARCH" = amd64 ]; then
            if ! arch -x86_64 /usr/bin/true; then
              softwareupdate --install-rosetta --agree-to-license
            fi
            arch -x86_64 /usr/bin/true
            arch -x86_64 "$binary" --version
            arch -x86_64 "$binary" --help
          else
            "$binary" --version
            "$binary" --help
          fi

  npm:
    timeout-minutes: 45
    if: github.event_name == 'push'
    needs: [build, verify]
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.publish.outputs.dist_tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: payload
      - name: Publish immutable tarball through npm OIDC
        id: publish
        env:
          TAG: ${{ needs.build.outputs.tag }}
          PACKAGE_NAME: '@openclaw/clawscan'
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/release.npmrc
        run: |
          set -euo pipefail
          npm install --global npm@11.20.0
          version=${TAG#v}
          if npm view "$PACKAGE_NAME@$version" version --json >"$RUNNER_TEMP/npm-existing.json" 2>"$RUNNER_TEMP/npm-view.err"; then
            echo "Version already exists; refusing to publish" >&2; exit 1;
          fi
          grep -q E404 "$RUNNER_TEMP/npm-view.err"
          cd payload/release-assets
          sha256sum -c SHA256SUMS
          latest=$(npm view "$PACKAGE_NAME@latest" version)
          dist_tag=$(node -e '
            const [version, latest] = process.argv.slice(1);
            if (version.includes("-")) { console.log("next"); process.exit(); }
            const a=version.split(".").map(Number), b=latest.split(".").map(Number);
            const first=a.findIndex((n,i)=>n!==b[i]);
            console.log(first>=0 && a[first]<b[first] ? "legacy" : "latest");
          ' "$version" "$latest")
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          env -u NPM_TOKEN -u NODE_AUTH_TOKEN npm publish "clawscan-$version.tgz" --access public --provenance --tag "$dist_tag"
          expected="sha512-$(openssl dgst -sha512 -binary "clawscan-$version.tgz" | base64 -w0)"
          actual=
          for _ in {1..120}; do
            if actual=$(npm view "$PACKAGE_NAME@$version" dist.integrity 2>"$RUNNER_TEMP/npm-propagation.err"); then
              [[ -z "$actual" ]] || break
            else
              grep -q E404 "$RUNNER_TEMP/npm-propagation.err" || { cat "$RUNNER_TEMP/npm-propagation.err" >&2; exit 1; }
            fi
            sleep 15
          done
          test "$actual" = "$expected"
          npm view "$PACKAGE_NAME@$version" dist.tarball dist.integrity dist.attestations --json

  publish:
    if: github.event_name == 'push'
    needs: [build, verify, npm]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: payload
      - name: Reverify immutable tag and publish exact archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
          DIST_TAG: ${{ needs.npm.outputs.dist_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/audit/tag"
          test "$(git rev-parse refs/audit/tag)" = "$TAG_OBJECT"
          test "$(git rev-parse refs/audit/tag^{})" = "$TARGET_SHA"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag refs/audit/tag
          (cd payload/release-assets && sha256sum -c SHA256SUMS)
          flags=()
          [[ "$TAG" != *-* ]] || flags+=(--prerelease)
          [[ "$DIST_TAG" = latest ]] || flags+=(--latest=false)
          gh release create "$TAG" payload/release-assets/* --verify-tag --title "$TAG" --notes-file payload/release-notes.md "${flags[@]}"

  homebrew:
    if: github.event_name == 'push' && needs.npm.outputs.dist_tag == 'latest'
    needs: [build, publish, npm]
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-release.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
