name: Runtime Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/runtime-image.yml'
      - 'docker/clawscan-runtime/**'
  pull_request:
    paths:
      - '.github/workflows/runtime-image.yml'
      - 'docker/clawscan-runtime/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name != 'pull_request'
    name: Build runtime image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/clawscan-runtime
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/clawscan-runtime
          file: docker/clawscan-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  verify:
    if: github.event_name == 'pull_request'
    name: Verify runtime image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A real single-platform Docker export/load, not a cache-only PR build.
      # Native runners avoid treating emulated CLI execution as architecture proof.
      - name: Build and load image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/clawscan-runtime
          file: docker/clawscan-runtime/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          provenance: false
          tags: clawscan-runtime:ci

      - name: Record immutable loaded-image identity
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_id="$(docker image inspect --format '{{.Id}}' clawscan-runtime:ci)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{.Architecture}}' "$image_id")" == "$EXPECTED_ARCH" ]]
          [[ "$(docker image inspect --format '{{.Os}}' "$image_id")" == linux ]]
          mkdir -p runtime-image-proof
          printf 'source=%s\nplatform=linux/%s\nbuild_digest=%s\nloaded_image_id=%s\n' \
            "$(git rev-parse HEAD)" "$EXPECTED_ARCH" "$BUILD_DIGEST" "$image_id" \
            > runtime-image-proof/identity.txt
          printf 'RUNTIME_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          cat runtime-image-proof/identity.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke installed CLIs without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none "$RUNTIME_IMAGE_ID" /bin/sh -ec '
            skillspector --help
            aig-skill-scan --help
            codex --version
          ' 2>&1 | tee runtime-image-proof/cli-smoke.txt

      - name: Retain successful export and smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-proof-linux-${{ matrix.arch }}
          path: runtime-image-proof/
          if-no-files-found: error
          retention-days: 7
