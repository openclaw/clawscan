name: Runtime Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/runtime-image*.yml'
      - 'scripts/runtime-image/**'
      - 'docker/clawscan-runtime/**'
  pull_request:
    paths:
      - '.github/workflows/runtime-image*.yml'
      - 'scripts/runtime-image/**'
      - 'docker/clawscan-runtime/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/runtime-image-platform.yml
    permissions:
      contents: read
    with:
      publish: false

  build:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/runtime-image-platform.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  merge:
    name: Publish complete runtime manifest
    needs: build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: clawscan-runtime-publication
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download this run's native proofs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-image-proof-linux-*
          path: runtime-image-proof

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/clawscan-runtime
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate both digests and publish one complete index
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_RESULT: ${{ needs.build.result }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/runtime-image/publish.py merge

      - name: Retain manifest identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-manifest
          path: runtime-image-proof/manifest.json
          if-no-files-found: error
          retention-days: 7
