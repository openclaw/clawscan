version: 1

profiles:
  clawhub:
    scanners:
      - id: skillspector
        gate:
          rules: &skillspector-gate-rules
            - id: do-not-install
              path:
                - risk_recommendation|riskRecommendation|recommendation
                - risk_assessment.recommendation|risk_recommendation|riskRecommendation
                - riskAssessment.recommendation|risk_recommendation|riskRecommendation
              equals: DO_NOT_INSTALL
              normalize: identifier
              action: block
            - id: critical-finding
              path:
                - filtered_findings[].severity|risk_severity|level
                - filteredFindings[].severity|risk_severity|level
                - findings[].severity|risk_severity|level
                - issues[].severity|risk_severity|level
                - vulnerabilities[].severity|risk_severity|level
              equals: CRITICAL
              normalize: identifier
              fallback: root
              action: block
            - id: high-finding
              path:
                - filtered_findings[].severity|risk_severity|level
                - filteredFindings[].severity|risk_severity|level
                - findings[].severity|risk_severity|level
                - issues[].severity|risk_severity|level
                - vulnerabilities[].severity|risk_severity|level
              equals: HIGH
              normalize: identifier
              fallback: root
              action: warn
      - id: clawscan-static
        gate:
          rules:
            - id: any-finding
              path: findings[]
              exists: true
              action: warn
    sandbox:
      env:
        - OPENAI_API_KEY
        - CODEX_API_KEY
        - SKILLSPECTOR_PROVIDER
    judge:
      command: >-
        codex exec --cd {{ workspace }}
        --model gpt-5.5
        --sandbox {{ judge_sandbox }}
        --skip-git-repo-check
        --ignore-user-config
        -c approval_policy=never
        -c model_reasoning_effort=high
        -c service_tier=fast
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --output-schema {{ output_schema:output.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:prompt.md }}
  clawhub-aig:
    scanners:
      - id: skillspector
        gate:
          rules: *skillspector-gate-rules
      - aig
    sandbox:
      env:
        - OPENAI_API_KEY
        - CODEX_API_KEY
        - SKILLSPECTOR_PROVIDER
        - LLM_API_KEY
    judge:
      command: >-
        codex exec --cd {{ workspace }}
        --model gpt-5.5
        --sandbox {{ judge_sandbox }}
        --skip-git-repo-check
        --ignore-user-config
        -c approval_policy=never
        -c model_reasoning_effort=high
        -c service_tier=fast
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --output-schema {{ output_schema:output.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:prompt.md }}
