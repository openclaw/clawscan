version: 1

profiles:
  clawhub:
    scanners:
      - skillspector
      - aig
    # Plugins run in-process in the gateway; audit the whole plugin, including
    # embedded skills and compiled output, with A.I.G's MCP code audit only.
    pluginScanners:
      - aig-mcp
    scannerEnvDefaults:
      SKILLSPECTOR_PROVIDER: openai
      SKILLSPECTOR_MODEL: gpt-6.1-sol
      SKILLSPECTOR_REASONING_EFFORT: medium
      DEFAULT_MODEL: gpt-6.1-sol
      REASONING_EFFORT: medium
    sandbox:
      env:
        - OPENAI_API_KEY
        - CODEX_API_KEY
        - SKILLSPECTOR_PROVIDER
        - SKILLSPECTOR_MODEL
        - SKILLSPECTOR_REASONING_EFFORT
        - LLM_API_KEY
        - DEFAULT_MODEL
        - REASONING_EFFORT
        - DEFAULT_BASE_URL
        - OPENAI_BASE_URL
        - DECISIONS_API_KEY
        - DECISIONS_BASE_URL
        - DECISIONS_MODEL
        - DECISIONS_MAX_INPUT_CHARS
        - OVERVIEW_MODEL
    # Codex decides from scanner results only. evidenceOnly keeps the artifact
    # out of the workspace and prompt. The disabled features remove or
    # neutralize every file, shell, image, web and code-execution tool Codex
    # 0.164 offers; see docs/judge.md for the verified tool list and the
    # sub-agent tools that remain.
    judge:
      evidenceOnly: true
      command: >-
        [ -n "$CODEX_API_KEY" ] || export CODEX_API_KEY="$OPENAI_API_KEY";
        codex exec --cd {{ workspace }}
        --model gpt-6.1-sol
        --sandbox read-only
        --skip-git-repo-check
        --ignore-user-config
        -c approval_policy=never
        -c model_reasoning_effort=high
        -c 'service_tier="default"'
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --disable shell_tool --disable unified_exec --disable view_image
        --disable multi_agent --disable goals --disable apps --disable plugins
        --disable browser_use --disable computer_use --disable image_generation
        --disable hooks --disable code_mode_host --disable multi_agent_v2
        --disable sleep_tool
        -c web_search=disabled
        -c skills.include_instructions=false
        ${OPENAI_BASE_URL:+-c model_provider=clawscan
        -c model_providers.clawscan.name=ClawScan
        -c model_providers.clawscan.base_url=$OPENAI_BASE_URL
        -c model_providers.clawscan.env_key=CODEX_API_KEY
        -c model_providers.clawscan.wire_api=responses}
        --output-schema {{ output_schema:evidence-judge.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:evidence-judge.md }}
    overview:
      evidenceOnly: true
      command: >-
        [ -n "$CODEX_API_KEY" ] || export CODEX_API_KEY="$OPENAI_API_KEY";
        codex exec --cd {{ workspace }}
        --model "${OVERVIEW_MODEL:-gpt-6-luna}"
        --sandbox read-only
        --skip-git-repo-check
        --ignore-user-config
        -c approval_policy=never
        -c model_reasoning_effort=low
        -c 'service_tier="default"'
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --disable shell_tool --disable unified_exec --disable view_image
        --disable multi_agent --disable goals --disable apps --disable plugins
        --disable browser_use --disable computer_use --disable image_generation
        --disable hooks --disable code_mode_host --disable multi_agent_v2
        --disable sleep_tool
        -c web_search=disabled
        -c skills.include_instructions=false
        ${OPENAI_BASE_URL:+-c model_provider=clawscan
        -c model_providers.clawscan.name=ClawScan
        -c model_providers.clawscan.base_url=$OPENAI_BASE_URL
        -c model_providers.clawscan.env_key=CODEX_API_KEY
        -c model_providers.clawscan.wire_api=responses}
        --output-schema {{ output_schema:overview.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:evidence-overview.md }}
