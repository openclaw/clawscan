version: 1

profiles:
  clawhub:
    scanners:
      - skillspector
      - clawscan-static
      - aig
    scannerEnvDefaults:
      SKILLSPECTOR_PROVIDER: openai
      SKILLSPECTOR_MODEL: gpt-6.1-sol
      SKILLSPECTOR_REASONING_EFFORT: medium
      DEFAULT_MODEL: gpt-6.1-sol
      REASONING_EFFORT: medium
    sandbox:
      env:
        - OPENAI_API_KEY
        - CODEX_API_KEY
        - SKILLSPECTOR_PROVIDER
        - SKILLSPECTOR_MODEL
        - SKILLSPECTOR_REASONING_EFFORT
        - LLM_API_KEY
        - DEFAULT_MODEL
        - REASONING_EFFORT
        - DEFAULT_BASE_URL
    judge:
      command: >-
        [ -n "$CODEX_API_KEY" ] || export CODEX_API_KEY="$OPENAI_API_KEY";
        codex exec --cd {{ workspace }}
        --model gpt-6.1-sol
        --sandbox {{ judge_sandbox }}
        --skip-git-repo-check
        --ignore-user-config
        -c approval_policy=never
        -c model_reasoning_effort=high
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --output-schema {{ output_schema:output.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:prompt.md }}
  clawhub-aig:
    scanners:
      - skillspector
      - aig
    scannerEnvDefaults:
      SKILLSPECTOR_PROVIDER: openai
      SKILLSPECTOR_MODEL: gpt-6.1-sol
      SKILLSPECTOR_REASONING_EFFORT: medium
      DEFAULT_MODEL: gpt-6.1-sol
      REASONING_EFFORT: medium
    sandbox:
      env:
        - OPENAI_API_KEY
        - CODEX_API_KEY
        - SKILLSPECTOR_PROVIDER
        - SKILLSPECTOR_MODEL
        - SKILLSPECTOR_REASONING_EFFORT
        - LLM_API_KEY
        - DEFAULT_MODEL
        - REASONING_EFFORT
        - DEFAULT_BASE_URL
    judge:
      command: >-
        [ -n "$CODEX_API_KEY" ] || export CODEX_API_KEY="$OPENAI_API_KEY";
        codex exec --cd {{ workspace }}
        --model gpt-6.1-sol
        --sandbox {{ judge_sandbox }}
        --skip-git-repo-check
        --ignore-user-config
        -c approval_policy=never
        -c model_reasoning_effort=high
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --output-schema {{ output_schema:output.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:prompt.md }}
